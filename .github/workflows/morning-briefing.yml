name: Generate morning briefing

on:
  schedule:
    # Runs at 06:00 UTC daily — adjust to your timezone.
    # (BST/summer UK = UTC+1, so 06:00 UTC = 7am UK time)
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually to test

permissions:
  contents: write

jobs:
  build-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser

      - name: Generate briefing
        run: python generate_briefing.py

      - name: Commit updated feed
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add feed.json
          git commit -m "Update morning briefing" || echo "No changes"
          git push
